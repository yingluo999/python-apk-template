name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip
        pip install buildozer cython

    - name: 构建 APK
      run: |
        yes | buildozer android debug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: zodiac-apk
        path: bin/*.apk
        retention-days: 30
