name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 使用 Docker 构建 APK
      run: |
        docker run --rm \
          -v $(pwd):/app \
          -w /app \
          kivy/buildozer:latest \
          buildozer android debug

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: zodiac-register-apk
        path: bin/*.apk
        retention-days: 30
